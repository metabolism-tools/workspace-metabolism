[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-metabolism"
version = "0.5.0"
description = "MCP server and CLI for policy-driven file governance in AI workspaces: audit, reversible cleanup, rollback, and verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "ai-agents",
    "ai-coding",
    "ai-governance",
    "audit",
    "cleanup",
    "cli",
    "file-management",
    "lifecycle",
    "mcp",
    "model-context-protocol",
    "rollback",
    "workspace-management",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/metabolism-tools/workspace-metabolism"
Repository = "https://github.com/metabolism-tools/workspace-metabolism"
Documentation = "https://github.com/metabolism-tools/workspace-metabolism#readme"
Issues = "https://github.com/metabolism-tools/workspace-metabolism/issues"

[project.scripts]
wm = "workspace_metabolism.cli:main"
workspace-meta = "workspace_metabolism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
