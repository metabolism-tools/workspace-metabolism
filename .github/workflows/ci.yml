name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check the installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv .wheel-check
          if [ -f .wheel-check/Scripts/python.exe ]; then
            py=.wheel-check/Scripts/python.exe
          else
            py=.wheel-check/bin/python
          fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$py" tools/verify_release.py --version "$version" --wheel "dist/workspace_metabolism-$version-py3-none-any.whl"
