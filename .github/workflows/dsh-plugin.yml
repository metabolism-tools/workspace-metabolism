name: DSH maintenance plugin

on:
  push:
    paths: ['plugins/dsh-metabolic-maintenance/**', 'skills/metabolic-maintenance/**', 'tests/test_maintenance_observation_demo.py', '.github/workflows/dsh-plugin.yml']
  pull_request:
    paths: ['plugins/dsh-metabolic-maintenance/**', 'skills/metabolic-maintenance/**', 'tests/test_maintenance_observation_demo.py', '.github/workflows/dsh-plugin.yml']

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/dsh-metabolic-maintenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/dsh-metabolic-maintenance/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python -m pip install pytest
      - run: python -m pytest ../../tests/test_maintenance_observation_demo.py -q
      - run: npm pack
