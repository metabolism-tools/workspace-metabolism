name: DSH maintenance plugin

on:
  push:
    paths: ['plugins/dsh-metabolic-maintenance/**', 'skills/metabolic-maintenance/**', '.github/workflows/dsh-plugin.yml']
  pull_request:
    paths: ['plugins/dsh-metabolic-maintenance/**', 'skills/metabolic-maintenance/**', '.github/workflows/dsh-plugin.yml']

jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/dsh-metabolic-maintenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/dsh-metabolic-maintenance/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm pack
